# XcodeGen manifest — the .xcodeproj is a build artifact, never committed.
# Regenerate with: cd ios && xcodegen generate
name: ParkingPin

options:
  bundleIdPrefix: kr.parkingpin
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

# docs/04_IOS_IMPLEMENTATION.md §17: DEV / STAGING / PROD.
configs:
  DEV: debug
  STAGING: release
  PROD: release

configFiles:
  DEV: Config/Dev.xcconfig
  STAGING: Config/Staging.xcconfig
  PROD: Config/Prod.xcconfig

fileGroups:
  - Config

# docs/04_IOS_IMPLEMENTATION.md §14: SPM. The version is exact, never a range —
# docs/16 §10 forbids dynamic versions, and an SDK that moves under CI is an SDK
# whose privacy behaviour nobody re-checked.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.2

targets:
  ParkingPin:
    type: application
    platform: iOS
    sources:
      - path: ParkingPin
    dependencies:
      # docs/07 §2 lists what this app may use. Analytics and Auth are the two this
      # milestone wires; Firestore, Functions, App Check, Remote Config and Crashlytics
      # are deliberately absent until the feature that needs them lands, and Storage is
      # forbidden outright.
      #
      # `FirebaseAnalytics` alone, and deliberately **not** the
      # `FirebaseAnalyticsIdentitySupport` product beside it: that one is what links
      # AdSupport and collects the IDFA. docs/17 §3 fixes the property list and no
      # advertising identifier is on it, and docs/17 §5 forbids invasive fingerprinting —
      # so the app must not link it. This is the iOS counterpart of the
      # `google_analytics_adid_collection_enabled=false` flag in the Android manifest.
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseAuth
      # docs/04 §13. Embedded, so installing the app installs the widget.
      - target: ParkingPinWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PK_BUNDLE_ID)
        INFOPLIST_FILE: ParkingPin/Resources/Info.plist
        # docs/06 §6: the App Group is the only entitlement either target carries.
        CODE_SIGN_ENTITLEMENTS: ParkingPin/Resources/ParkingPin.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # docs/04_IOS_IMPLEMENTATION.md §13 / docs/06 §7a: `systemSmall` + `systemMedium`,
  # reading the App Group projection and stepping the floor through an AppIntent.
  #
  # The shared files below are listed in both targets rather than moved into a framework.
  # A widget extension that links a dynamic framework pays for it on every render, and
  # docs/06 §7a's requirement is that the *floor domain* be shared — which compiling the
  # one `FloorValue.swift` in both targets satisfies exactly. There is no second copy of
  # the rules anywhere, and a change to the domain cannot reach one process without the
  # other.
  ParkingPinWidgetExtension:
    # `app-extension`, not a widget-specific type: a WidgetKit extension is an ordinary
    # app extension whose Info.plist declares `com.apple.widgetkit-extension`, and
    # XcodeGen 2.46 has no separate spelling for it.
    type: app-extension
    platform: iOS
    sources:
      - path: ParkingPinWidget
      # The projection, its shared mutation helper, and the entitlement gate.
      - path: ParkingPin/Widget
      # The one place Plus is decided, which that gate reads (docs/08 §3).
      - path: ParkingPin/Entitlement/PlusEntitlement.swift
      # The shared floor domain and the elapsed-time formatter.
      - path: ParkingPin/Parking/Domain/FloorValue.swift
      - path: ParkingPin/Parking/Domain/ParkingElapsed.swift
      # Bundle identity (the entitlement gate reads `PKAppEnvironment`) and OSLog.
      - path: ParkingPin/Core/AppInfo.swift
      - path: ParkingPin/Core/AppLog.swift
      # docs/10 §2 design tokens. Not a copy of the palette: the colours themselves are
      # the asset catalog below, which both bundles carry because `ColorResource` resolves
      # against the *running* bundle and the widget is its own process.
      - path: ParkingPin/DesignSystem/PKColor.swift
      - path: ParkingPin/DesignSystem/PKMetrics.swift
      - path: ParkingPin/DesignSystem/PKTypography.swift
      - path: ParkingPin/DesignSystem/PKComponents.swift
      # `pkPressFeedback`, which every button style in PKComponents applies.
      - path: ParkingPin/DesignSystem/PKMotion.swift
      - path: ParkingPin/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PK_BUNDLE_ID).widget
        INFOPLIST_FILE: ParkingPinWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ParkingPinWidget/ParkingPinWidget.entitlements

  ParkingPinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParkingPinTests
      # docs/05_CROSS_PLATFORM_DOMAIN_CONTRACT.md §8: the parity fixtures both platforms
      # replay. A folder reference, not a file list — the runner enumerates what is there,
      # so a fixture added to the contract cannot be silently skipped by this manifest.
      - path: ../platform-tests
        buildPhase: resources
        type: folder
    dependencies:
      - target: ParkingPin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ParkingPin:
    build:
      targets:
        ParkingPin: all
        ParkingPinWidgetExtension: all
        ParkingPinTests: [test]
    run:
      config: DEV
    test:
      config: DEV
      targets:
        - ParkingPinTests
    analyze:
      config: DEV
    profile:
      config: PROD
    archive:
      config: PROD
